name: ingest result
# Turns a b70-bench result issue into results/<issue>.json + RESULTS.md. Issue text is untrusted: it is only read
# by ingest.py from the event file, never interpolated into a shell command.
on:
  issues:
    types: [opened, edited, reopened, closed]
permissions:
  contents: write
  issues: write
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    if: contains(github.event.issue.body, '<!-- b70-bench-result v1 -->')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: parse and rebuild table
        run: python3 .github/scripts/ingest.py "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/comment.md"
      - name: commit
        env:
          N: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A results RESULTS.md
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "results: issue #$N"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
      - name: reply
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: |
          if [ -s "$RUNNER_TEMP/comment.md" ]; then gh issue comment "$N" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"; fi
